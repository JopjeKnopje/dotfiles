- defaults:
    link:
      relink: true

- create:
    - ~/.config/k9s/

- clean: ['~']

- link:
    ~/:
      path: bash/.*
      glob: true
    ~/.config/sway: sway
    # ~/.config/systemd: systemd
    ~/.config/k9s/:
      glob: true
      path: k9s/*
    ~/.config/ghostty: ghostty
    ~/.config/lazygit: lazygit
    ~/.config/nvim: nvim
    ~/.config/rofi: rofi
    ~/.config/terminator: terminator
    ~/.config/tms: tms
    ~/.config/tmux: tmux
    ~/scripts: scripts
    # ~/.Xresources: X11/.Xresources
    ~/.gitconfig:
      if: '[ `hostname` != gamelan5 ]'
      path: git/.gitconfig
      relink: true
    ~/:
      relink: true
      glob: true
      path: zsh/*
      path: zsh/.*


- shell:
  - [git submodule update --init --recursive, Installing submodules]
